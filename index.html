    <style>
        /* ==========================================================================
           RESET & VARIABLES DE ESTILO
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --font-title: 'Tenor Sans', serif;
            --font-sans: 'Montserrat', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.14);
            --glass-bg-hover: rgba(255, 255, 255, 0.24);
            --glass-border: rgba(255, 255, 255, 0.38);
            --glass-border-hover: rgba(255, 255, 255, 0.75);
            --text-pure: #FFFFFF;
            --text-soft: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.55);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: var(--font-sans);
            color: var(--text-pure);
        }

        /* ==========================================================================
           FONDO FOTOGRÁFICO DE ALTA ARQUITECTURA + OVERLAY EDITORIAL
           ========================================================================== */
        .stage-background {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: url('./pexels-photo-30484316.jpg.jpeg');
            background-size: cover;
            background-position: center 35%;
            background-repeat: no-repeat;
            transform: scale(1.02);
            transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Viñeta graduada para contraste superior e inferior */
        .stage-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                180deg, 
                rgba(10, 10, 12, 0.65) 0%, 
                rgba(10, 10, 12, 0.15) 35%, 
                rgba(10, 10, 12, 0.25) 60%, 
                rgba(10, 10, 12, 0.80) 100%
            );
        }

        /* ==========================================================================
           CONTENEDOR PRINCIPAL MOBILE-FIRST (CENTRADO EN PANTALLAS GRANDES)
           ========================================================================== */
        .mobile-shell {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: 440px;
            margin: 0 auto;
            padding: clamp(36px, 7vh, 60px) 24px clamp(24px, 4vh, 32px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* ==========================================================================
           CABECERA HERO (H1 + SUBTÍTULO BIO)
           ========================================================================== */
        .hero-block {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeInDown 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: clamp(1.85rem, 5.8vw, 2.35rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1.15;
            color: var(--text-pure);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            opacity: 0.85;
        }

        .hero-divider-dot {
            width: 3.5px;
            height: 3.5px;
            background-color: var(--text-pure);
            border-radius: 50%;
            opacity: 0.7;
        }

        .hero-tag {
            font-size: 0.78rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-soft);
        }

        .hero-bio {
            font-size: clamp(0.92rem, 2.7vw, 1.02rem);
            font-weight: 300;
            line-height: 1.45;
            color: var(--text-soft);
            max-width: 310px;
            margin-top: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
            letter-spacing: 0.02em;
        }

        /* ==========================================================================
           BLOQUE INFERIOR: BOTONERA FROSTED GLASS + CRÉDITO
           ========================================================================== */
        .bottom-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.15s;
        }

        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        /* ==========================================================================
           BOTÓN GLASSMORPHISM SOFT ULTRA MODERNO
           ========================================================================== */
        .glass-pill-btn {
            position: relative;
            width: 100%;
            height: 56px;
            border-radius: 999px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--glass-border);
            color: var(--text-pure);
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Resplandor sutil diagonal */
        .glass-pill-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transition: left 0.6s ease;
        }

        .glass-pill-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            transform: translateY(-2px);
            box-shadow: 
                0 14px 36px rgba(0, 0, 0, 0.38),
                inset 0 1px 1.5px rgba(255, 255, 255, 0.5);
        }

        .glass-pill-btn:hover::before {
            left: 100%;
        }

        .glass-pill-btn:active {
            transform: translateY(0) scale(0.985);
        }

        /* Icono fijo a la izquierda */
        .btn-icon-slot {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon-slot svg {
            width: 21px;
            height: 21px;
            fill: var(--text-pure);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Texto perfectamente centrado en la píldora */
        .btn-label-text {
            flex: 1;
            text-align: center;
            font-size: 0.98rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text-pure);
            margin-right: 26px; /* Compensa el ancho del ícono izquierdo para centrado óptico */
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* ==========================================================================
           CRÉDITO FOOTER
           ========================================================================== */
        .credit-caption {
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 300;
            text-align: center;
            user-select: none;
        }

        /* ==========================================================================
           ANIMACIONES
           ========================================================================== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <!-- ==========================================================================
         ACELERACIÓN EXTREMA: WEB WORKERS + WEBASSEMBLY (WASM) + SERVICE WORKER
         ========================================================================== -->
    <script>
    (function() {
        'use strict';

        /* 1. MÓDULO WEBASSEMBLY NATIVO (Binario WASM puro inline compilado)
           Exporta: lerp(current: f32, target: f32, factor: f32) -> f32
           Cálculo de interpolación en sub-nanosegundos sin sobrecargar el garbage collector */
        const wasmBytecode = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, // Magic & Version
            0x01, 0x08, 0x01, 0x60, 0x03, 0x7d, 0x7d, 0x7d, 0x01, 0x7d, // Type Section: (f32,f32,f32)->f32
            0x03, 0x02, 0x01, 0x00,                         // Function Section
            0x07, 0x08, 0x01, 0x04, 0x6c, 0x65, 0x72, 0x70, 0x00, 0x00, // Export "lerp"
            0x0a, 0x0e, 0x01, 0x0c, 0x00, 0x20, 0x00, 0x20, 0x01, 0x20, 0x00, 0x93, 0x20, 0x02, 0x94, 0x92, 0x0b // Code: f32 math
        ]);

        /* 2. DEDICATED WEB WORKER INLINE CON WEBASSEMBLY
           Maneja prefetch fuera del hilo principal (off-main-thread) y sincroniza datos de cálculo */
        const workerSource = `
            let wasmInstance = null;
            self.onmessage = async (e) => {
                const { type, buffer, payload } = e.data;
                if (type === 'INIT_WASM') {
                    const module = await WebAssembly.compile(buffer);
                    wasmInstance = await WebAssembly.instantiate(module);
                    self.postMessage({ type: 'WASM_READY' });
                } else if (type === 'PRELOAD_ASSETS') {
                    payload.assets.forEach(url => {
                        fetch(url, { mode: 'no-cors', priority: 'high' }).catch(() => {});
                    });
                }
            };
        `;

        try {
            const workerBlob = new Blob([workerSource], { type: 'application/javascript' });
            const computationWorker = new Worker(URL.createObjectURL(workerBlob));

            computationWorker.postMessage({
                type: 'INIT_WASM',
                buffer: wasmBytecode.buffer
            }, [wasmBytecode.buffer]);

            // Precarga ultra rápida de recursos críticos fuera de la UI
            computationWorker.postMessage({
                type: 'PRELOAD_ASSETS',
                payload: {
                    assets: [
                        './pexels-photo-30484316.jpg.jpeg',
                        'https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Tenor+Sans&display=swap'
                    ]
                }
            });
        } catch(e) {}

        /* 3. SERVICE WORKER INLINE CON CACHE-FIRST ULTRA-RÁPIDO
           Guarda la página, las fuentes y la imagen de fondo en CacheStorage.
           La próxima visita o recarga se sirve con latencia de 0 ms */
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            const swCode = `
                const CACHE_NAME = 'esperanza-v1';
                const CRITICAL_ASSETS = [
                    './',
                    './pexels-photo-30484316.jpg.jpeg'
                ];

                self.addEventListener('install', event => {
                    self.skipWaiting();
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => cache.addAll(CRITICAL_ASSETS)).catch(() => {})
                    );
                });

                self.addEventListener('activate', event => {
                    event.waitUntil(self.clients.claim());
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(cachedResponse => {
                            if (cachedResponse) {
                                fetch(event.request).then(networkResponse => {
                                    if (networkResponse && networkResponse.status === 200) {
                                        caches.open(CACHE_NAME).then(cache => cache.put(event.request, networkResponse));
                                    }
                                }).catch(() => {});
                                return cachedResponse;
                            }
                            return fetch(event.request);
                        })
                    );
                });
            `;

            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    })();
    </script>
